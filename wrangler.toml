# =============================================================================
# Capital One Clone - Cloudflare Workers Configuration
# Deploy with: npx wrangler deploy
# =============================================================================

name = "capitalone"
main = "workers/api.js"
compatibility_date = "2024-10-22"

# Serve frontend assets from the dist directory
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = false

# Bindings for environment variables (set via: npx wrangler secret put KEY)
# SENDGRID_API_KEY, MAILGUN_API_KEY, MAILGUN_DOMAIN

[vars]
# Set these via `npx wrangler secret put` for production
# PORT = "3001"

# ---------------------------------------------------------------------------
# Cloud sync (shared state across all devices/browsers) via KV.
# Created with: npx wrangler kv namespace create BANKING_KV
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "BANKING_KV"
id = "66d6c31fcee74203ac478c3904d1cef1"

# Cloudflare R2 bucket for uploaded images (cross-device image access).
# 1) Create it (free):
#      npx wrangler r2 bucket create capitalone-uploads
# 2) Uncomment and set the bucket_name.
# [[r2_buckets]]
# binding = "UPLOADS"
# bucket_name = "capitalone-uploads"